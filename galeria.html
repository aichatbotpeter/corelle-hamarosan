<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Kép nagyban">
  <button class="zar" id="zar" aria-label="Bezárás">Bezár ✕</button>
  <button class="nyil elozo" id="elozo" aria-label="Előző kép">‹</button>
  <img id="lbkep" src="" alt="" />
  <button class="nyil kovi" id="kovi" aria-label="Következő kép">›</button>
  <div class="lb-cap" id="lbcap"></div>
</div>

<script>
  document.getElementById('ev').textContent = new Date().getFullYear();

  var elemek = Array.prototype.slice.call(document.querySelectorAll('.item'));
  var lb = document.getElementById('lb');
  var lbkep = document.getElementById('lbkep');
  var lbcap = document.getElementById('lbcap');
  var mostani = 0;

  function mutat(i) {
    mostani = (i + elemek.length) % elemek.length;
    var e = elemek[mostani];
    lbkep.src = e.getAttribute('data-nagy');
    lbkep.alt = e.querySelector('img').alt;
    lbcap.textContent = e.querySelector('figcaption').textContent;
  }
  function nyit(i) {
    mutat(i);
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
    document.getElementById('zar').focus();
  }
  function zar() {
    lb.classList.remove('open');
    document.body.style.overflow = '';
    lbkep.src = '';
    if (elemek[mostani]) elemek[mostani].focus();
  }

  elemek.forEach(function (e, i) {
    e.addEventListener('click', function () { nyit(i); });
    e.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); nyit(i); }
    });
  });
  document.getElementById('zar').addEventListener('click', zar);
  document.getElementById('elozo').addEventListener('click', function () { mutat(mostani - 1); });
  document.getElementById('kovi').addEventListener('click', function () { mutat(mostani + 1); });
  lb.addEventListener('click', function (e) { if (e.target === lb) zar(); });
  document.addEventListener('keydown', function (e) {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') zar();
    if (e.key === 'ArrowLeft') mutat(mostani - 1);
    if (e.key === 'ArrowRight') mutat(mostani + 1);
  });
</script>
